<div class="sys-info">
    <div class="info-pill"><span class="temp-icon">🖥️</span> <span data-i18n="sys_host">Host</span>: <span id="sys-hostname">Loading...</span></div>
    <a href="temperature.html" class="info-pill temp-pill-link" id="temp-pill-container" data-tooltip="Click to view all temperature sensors">
