<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Hunter | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="sidebar-container" class="sidebar"></div>

    <div class="main-wrapper">
        <div id="header-container" class="header"></div>

        <div class="content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                <h2 style="margin:0;" data-i18n="active_disks">Active Disks</h2>
                <div id="dashboard-power-controls" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <button id="btn-power-shutdown" class="btn-action btn-power-shutdown" data-i18n="power_shutdown" data-tooltip="Power off the host machine (confirmation required; refused while disk operations run)">Shut Down Host</button>
                    <button id="btn-power-reboot" class="btn-action btn-power-reboot" data-i18n="power_reboot" data-tooltip="Restart the host machine (confirmation required; refused while disk operations run)">Reboot Host</button>
                    <button id="btn-rescan-hardware" class="btn-action" data-i18n="rescan_hardware" data-tooltip="Rescan PCIe and SCSI buses to detect newly connected drives without rebooting">Rescan Hardware</button>
                </div>
            </div>
            
            <div id="disk-list-container">
                </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
