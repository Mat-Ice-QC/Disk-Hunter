<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Hunter | Partition History</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
    <div id="sidebar-container" class="sidebar"></div>
    <div class="main-wrapper">
        <div id="header-container" class="header"></div>
        <div class="content">
            <div class="card">
                <div class="history-header">
                    <div>
                        <h2 class="history-title">Partition History</h2>
                        <p class="history-subtitle">A history of all disk partitioning and formatting operations.</p>
                    </div>
                    <div>
                        <button id="btn-refresh" class="btn-action">Refresh</button>
                        <button id="btn-export-csv" class="btn-action">Export CSV</button>
                        <button id="btn-clear-history" class="btn-action red">Clear History</button>
                        <a href="partition.html" class="btn-action">Back to Editor</a>
                    </div>
                </div>
                
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Event</th>
                            <th>Drive</th>
                            <th>S/N</th>
                            <th>Action</th>
                            <th>Parameters</th>
                            <th>User (IP)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr id="loading-message"><td colspan="8">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Log Detail Modal (command + output) -->
    <div id="log-detail-modal" class="modal-overlay">
        <div class="modal-box" style="max-width: 700px;">
            <div class="modal-header" id="log-detail-title">Log Details</div>
            <div class="modal-content" style="padding: 20px;">
                <p style="margin-bottom: 6px;"><strong>Drive:</strong> <span id="log-detail-drive">N/A</span> &nbsp; <strong>S/N:</strong> <span id="log-detail-serial">N/A</span></p>
                <p style="margin-bottom: 6px;"><strong>Event:</strong> <span id="log-detail-event">N/A</span></p>
                <p style="margin-bottom: 12px;"><strong>Status:</strong> <span id="log-detail-status">N/A</span></p>
                <label style="display:block; margin-bottom: 4px; color: var(--text-light);">Command run by worker:</label>
                <pre id="log-detail-command" style="background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow:auto; font-size: 12px;">N/A</pre>
                <label style="display:block; margin-top: 12px; margin-bottom: 4px; color: var(--text-light);">Worker output:</label>
                <pre id="log-detail-output" style="background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow:auto; font-size: 12px;">N/A</pre>
            </div>
            <div class="modal-actions" style="justify-content: center;">
                <button id="btn-log-detail-close" class="btn-action btn-smart">Close</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert/Confirm Modals -->
    <div id="custom-alert-modal" class="modal-overlay">
        <div class="modal-box alert-modal-box">
            <div class="modal-header" id="custom-alert-title">Alert</div>
            <div class="modal-content history-modal-content-center">
                <p id="custom-alert-msg" class="history-modal-msg"></p>
            </div>
            <div class="modal-actions history-modal-actions-center">
                <button id="btn-custom-alert-ok" class="btn-action btn-smart">OK</button>
            </div>
        </div>
    </div>

    <div id="custom-confirm-modal" class="modal-overlay">
        <div class="modal-box confirm-modal-box">
            <div class="modal-header" id="custom-confirm-title">Confirm Action</div>
            <div class="modal-content history-modal-content-center">
                <p id="custom-confirm-msg" class="history-modal-msg"></p>
            </div>
            <div class="modal-actions history-modal-actions-center">
                <button id="btn-custom-confirm-yes" class="btn-action red">Yes</button>
                <button id="btn-custom-confirm-no" class="btn-modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/partition_history.js"></script>
</body>
</html>
