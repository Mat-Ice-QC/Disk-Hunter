services:
  disk-hunter-ui:
    image: nginx:alpine
    container_name: disk_hunter_ui
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/99-custom.sh:ro
      - /etc/ssl:/etc/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    network_mode: host

  disk-hunter-api:
    build: ./backend
    container_name: disk_hunter_api
    restart: unless-stopped
    privileged: true 
    env_file: .env
    volumes:
      - /dev:/dev
      - /sys:/sys
      - /run/udev:/run/udev:ro
      - /var/run/docker.sock:/var/run/docker.sock 
      - ${DATA_DIR:-./data}:/app/data
    network_mode: host

  disk-hunter-nwipe:
    build: ./workers/nwipe
    image: disk-hunter-nwipe

  disk-hunter-smartctl-test:
    build: ./workers/smartctl-test
    image: disk-hunter-smartctl-test

  disk-hunter-nvme:
    build: ./workers/nvme
    image: disk-hunter-nvme

  disk-hunter-hdparm:
    build: ./workers/hdparm
    image: disk-hunter-hdparm

  disk-hunter-parted:
    build: ./workers/parted
    image: disk-hunter-parted
    container_name: disk_hunter_parted
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
    network_mode: "host"

  disk-hunter-smart-provider:
    build: ./smart-provider
    image: disk-hunter-smart-provider
    container_name: disk_hunter_smart_provider
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev:/dev
    network_mode: "host"

  disk-hunter-speedtest:
    build: ./workers/speedtest-worker
    image: disk-hunter-speedtest

  # Local console kiosk: runs Firefox ESR in kiosk mode on the host's tty2,
  # pointed at the Disk-Hunter UI. Intended for air-gapped deployments where
  # the operator drives Disk Hunter directly from the machine's physical
  # screen/keyboard/mouse with no desktop environment installed on the host.
  # Opt-in via compose profile so it does NOT start on a normal
  # `docker compose up`. Enable with: docker compose --profile kiosk up -d --build
  # KIOSK_URL (see .env.example) selects the startup page.
  disk-hunter-firefox-kiosk:
    build: ./workers/firefox-kiosk
    image: disk-hunter-firefox-kiosk
    container_name: disk_hunter_firefox_kiosk
    restart: unless-stopped
    env_file: .env
    # Xorg on a bare host virtual terminal needs direct device access and the
    # ability to switch VTs (chvt). This service is privileged by explicit user
    # request; privilege is scoped to this kiosk container only and no existing
    # service is altered. See docs/firefox-kiosk.md for the justification.
    privileged: true
    environment:
      - KIOSK_URL=${KIOSK_URL:-http://localhost}
    volumes:
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
    devices:
      - /dev/tty:/dev/tty
      - /dev/tty2:/dev/tty2
      - /dev/dri:/dev/dri
      - /dev/fb0:/dev/fb0
      - /dev/input:/dev/input
      - /dev/snd:/dev/snd
    network_mode: host
    profiles:
      - kiosk
